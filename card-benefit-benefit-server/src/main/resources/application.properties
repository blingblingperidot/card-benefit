server.port=8083

spring.application.name=card-benefit-benefit-server
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=card_benefit
spring.datasource.password=abcd1234

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.cardbenefit.benefit.dto
mybatis.configuration.map-underscore-to-camel-case=true

jwt.secret=card-benefit-secret-key-must-be-at-least-256-bits-long

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=benefit-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
