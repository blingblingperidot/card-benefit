server.port=8084

spring.application.name=card-benefit-location-server

# Oracle DB 연결 설정
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=card_benefit
spring.datasource.password=abcd1234

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.cardbenefit.location.dto
mybatis.configuration.map-underscore-to-camel-case=true

# JWT 설정
jwt.secret=card-benefit-secret-key-must-be-at-least-256-bits-long
jwt.expiration=86400000

# Kafka 설정
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer