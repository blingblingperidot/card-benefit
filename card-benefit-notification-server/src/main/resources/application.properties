server.port=8085

spring.application.name=card-benefit-notification-server

# Oracle DB 연결 설정
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:XE
spring.datasource.username=card_benefit
spring.datasource.password=abcd1234

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.cardbenefit.notification.dto
mybatis.configuration.map-underscore-to-camel-case=true

# Kafka 설정
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Firebase 설정
firebase.service-account=classpath:firebase-service-account.json